<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADK Agent Direct Tester</title>
  <style>
    :root {
      --bg: #070913;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #6366f1;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 30px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 820px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.8rem;
      background: linear-gradient(135deg, #06b6d4, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .mode-select {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .mode-btn {
      padding: 8px 18px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.88rem;
      cursor: pointer;
    }
    .mode-btn.active {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--accent);
      color: #38bdf8;
      font-weight: 600;
    }
    .endpoint-badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 99px;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.88rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 14px 22px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
    }
    button {
      background: linear-gradient(135deg, #06b6d4, #6366f1);
      color: #fff;
      border: none;
      border-radius: 99px;
      padding: 0 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .response-header {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .output-box {
      background: #03040a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-height: 140px;
      max-height: 420px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.9rem;
      color: #38bdf8;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .quick-tests {
      margin-top: 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .chip:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>ADK Agent Direct Tester</h1>
      <div class="mode-select">
        <button class="mode-btn active" id="btn-local" onclick="switchTarget('local')">🟢 Localhost (127.0.0.1:8080)</button>
        <button class="mode-btn" id="btn-cloud" onclick="switchTarget('cloud')">☁️ Cloud Run Service</button>
      </div>
      <div class="endpoint-badge" id="endpoint-badge">Target: http://127.0.0.1:8080</div>
    </div>

    <div class="card">
      <div class="input-group">
        <input type="text" id="user-input" placeholder="Type prompt to test ADK agent..." value="what is the time now">
        <button id="send-btn">Send Request</button>
      </div>

      <div class="quick-tests">
        <button class="chip" onclick="setTest('what is the time now')">🕒 Test Time</button>
        <button class="chip" onclick="setTest('what is the weather in Tokyo?')">🌤️ Test Weather</button>
        <button class="chip" onclick="setTest('I want to speak with a human support agent')">🤝 Test Escalation</button>
        <button class="chip" onclick="setTest('Sydney Opera House coordinates')">📍 Test Location</button>
      </div>

      <div style="margin-top: 24px;">
        <div class="response-header">ADK Agent Response Output:</div>
        <div class="output-box" id="output">Click "Send Request" to invoke ADK agent...</div>
      </div>
    </div>
  </div>

  <script>
    let currentTarget = 'local';
    let localBaseUrl = 'http://127.0.0.1:8080';
    let cloudBaseUrl = 'https://demo-agent-317584469189.us-central1.run.app';
    
    let localSessionId = null;
    let cloudSessionId = null;

    const inputEl = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const outputEl = document.getElementById('output');
    const badgeEl = document.getElementById('endpoint-badge');

    function switchTarget(target) {
      currentTarget = target;
      if (target === 'local') {
        document.getElementById('btn-local').classList.add('active');
        document.getElementById('btn-cloud').classList.remove('active');
        badgeEl.textContent = 'Target: ' + localBaseUrl;
      } else {
        document.getElementById('btn-cloud').classList.add('active');
        document.getElementById('btn-local').classList.remove('active');
        badgeEl.textContent = 'Target: ' + cloudBaseUrl;
      }
    }

    function setTest(text) {
      inputEl.value = text;
      sendRequest();
    }

    async function sendRequest() {
      const msg = inputEl.value.trim();
      if (!msg) return;

      const baseUrl = currentTarget === 'local' ? localBaseUrl : cloudBaseUrl;
      let activeSessionId = currentTarget === 'local' ? localSessionId : cloudSessionId;

      outputEl.textContent = `⏳ Connecting to ${currentTarget.toUpperCase()} ADK Agent...`;

      try {
        const userId = 'tester_user_1';
        
        // 1. Create Session if not created
        if (!activeSessionId) {
          outputEl.textContent = `⏳ Creating ADK Session on ${baseUrl}...`;
          const sessRes = await fetch(`${baseUrl}/apps/router_agent/users/${userId}/sessions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
          });
          const sessData = await sessRes.json();
          activeSessionId = sessData.id;
          if (currentTarget === 'local') localSessionId = activeSessionId;
          else cloudSessionId = activeSessionId;
        }

        outputEl.textContent = `⏳ Session Active (${activeSessionId}). Invoking router_agent...`;

        // 2. Invoke /run
        const runRes = await fetch(`${baseUrl}/run`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            appName: 'router_agent',
            userId: userId,
            sessionId: activeSessionId,
            newMessage: {
              role: 'user',
              parts: [{ text: msg }]
            }
          })
        });

        const runData = await runRes.json();
        outputEl.textContent = JSON.stringify(runData, null, 2);

      } catch (err) {
        outputEl.textContent = `❌ Error connecting to ${currentTarget.toUpperCase()}:\n` + err.toString() + 
          `\n\nTips:\n- For Localhost, ensure "adk web --port 8080" is running.\n- For Cloud Run, test in Google Cloud Shell or Cloud Console.`;
      }
    }

    sendBtn.addEventListener('click', sendRequest);
    inputEl.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendRequest();
    });
  </script>
</body>
</html>
